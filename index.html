<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerar Recibo de Pagamento</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="container">
    <h1>Recibo de Pagamento</h1>
    <form id="receiptForm">
      <label for="invoiceNumber">Número da Nota Fiscal:</label>
      <input type="text" id="invoiceNumber" name="invoiceNumber" required/>

      <label for="sender">Remetente:</label>
      <input type="text" id="sender" name="sender" required/>

      <label for="recipient">Destinatário:</label>
      <input type="text" id="recipient" name="recipient" required/>

      <label for="quantity">Quantidade de Volumes:</label>
      <input type="number" id="quantity" name="quantity" required/>

      <label for="invoiceValue">Valor da Nota Fiscal:</label>
      <input type="number" id="invoiceValue" name="invoiceValue" step="0.01" required/>

      <label for="freightValue">Valor do Frete:</label>
      <input type="number" id="freightValue" name="freightValue" step="0.01" required/>

      <label for="observations">Observações:</label>
      <textarea id="observations" name="observations" rows="4"></textarea>

      <button type="button" id="generatePDF">Gerar PDF</button>
    </form>
  </div>
